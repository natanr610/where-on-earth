<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12283A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Where on Earth?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink: #12283A;
    --paper: #EEF3F1;
    --guess: #E4572E;
    --real: #1F9E6E;
    --accent: #F2A33A;

    --bg: var(--paper);
    --fg: var(--ink);
    --surface: rgba(238, 243, 241, 0.94);
    --surface-solid: #ffffff;
    --muted: #4f6474;
    --line: rgba(18, 40, 58, 0.14);
    --shadow: 0 10px 30px rgba(18, 40, 58, 0.22);
    --btn-fg: var(--ink);
    --track: rgba(18, 40, 58, 0.12);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--ink);
      --fg: var(--paper);
      --surface: rgba(18, 40, 58, 0.94);
      --surface-solid: #1a3449;
      --muted: #a7b9c4;
      --line: rgba(238, 243, 241, 0.16);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --track: rgba(238, 243, 241, 0.14);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3, .display {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    letter-spacing: -0.02em; margin: 0;
  }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 999px; padding: 0.7em 1.2em;
    min-height: 44px; color: var(--btn-fg); background: var(--accent);
    transition: transform .12s ease, opacity .2s ease, background .2s ease;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { cursor: not-allowed; background: var(--surface-solid); color: var(--muted); border: 1px solid var(--line); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.ghost {
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--line);
  }
  .hidden { display: none !important; }

  /* Street View */
  #sv-wrap { position: fixed; inset: 0; overflow: hidden; background: #0c1a26; }
  #sv {
    position: absolute; left: 0; top: -70px;
    width: 100%; height: calc(100% + 70px); border: 0;
  }

  /* HUD */
  #hud {
    position: fixed; z-index: 500;
    top: calc(var(--safe-t) + 12px); left: calc(var(--safe-l) + 12px);
    display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
    max-width: calc(100vw - var(--safe-l) - var(--safe-r) - 24px);
  }
  .hud-stats {
    display: flex; gap: 14px; align-items: baseline;
    background: var(--surface); color: var(--fg);
    padding: 8px 14px; border-radius: 14px; box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .hud-stats .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; }
  .hud-stats .val { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.25rem; }
  .hud-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .hud-actions button { font-size: 0.85rem; padding: 0.5em 0.95em; min-height: 38px; box-shadow: var(--shadow); }

  /* Guess panel */
  #guess-panel {
    position: fixed; z-index: 600;
    right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 34px);
    display: flex; flex-direction: column; gap: 10px; align-items: stretch;
    width: 320px;
    transition: width .25s ease;
  }
  #guess-map {
    width: 100%; height: 210px; border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); border: 2px solid var(--surface);
    transition: height .25s ease; opacity: .85;
  }
  @media (hover: hover) and (min-width: 700px) {
    #guess-panel:hover { width: min(620px, 55vw); }
    #guess-panel:hover #guess-map { height: min(440px, 55vh); opacity: 1; }
  }
  .guess-controls { display: flex; gap: 8px; }
  .guess-controls button { flex: 1; box-shadow: var(--shadow); }
  #map-toggle { display: none; }

  @media (max-width: 699px), (hover: none) {
    #guess-panel {
      left: calc(var(--safe-l) + 12px); right: calc(var(--safe-r) + 12px);
      bottom: calc(var(--safe-b) + 32px); width: auto;
    }
    #guess-map { display: none; height: min(58dvh, 480px); opacity: 1; }
    #guess-panel.open #guess-map { display: block; }
    #map-toggle { display: block; }
  }

  /* Pins */
  .pin {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); border: 3px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
  }
  .pin::after {
    content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; left: 6px; top: 6px;
  }
  .pin.guess { background: var(--guess); }
  .pin.real { background: var(--real); }

  /* Overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 900;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
  }
  .center-screen {
    align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--safe-t) + 24px) calc(var(--safe-r) + 20px) calc(var(--safe-b) + 24px) calc(var(--safe-l) + 20px);
    overflow-y: auto;
  }
  #start h1 { font-size: clamp(2.6rem, 10vw, 5.2rem); font-weight: 800; line-height: .95; }
  #start h1 span { color: var(--accent); }
  #start p { font-size: 1.15rem; color: var(--muted); max-width: 30em; margin: 18px auto 28px; line-height: 1.45; }
  #start button { font-size: 1.15rem; padding: .85em 2em; }
  .globe {
    width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, rgba(255,255,255,.35), transparent 45%),
      radial-gradient(circle at 60% 60%, var(--real) 0 22%, transparent 23%),
      radial-gradient(circle at 30% 70%, var(--real) 0 12%, transparent 13%),
      radial-gradient(circle at 70% 25%, var(--real) 0 14%, transparent 15%),
      #2a6f97;
    box-shadow: inset -10px -10px 0 rgba(0,0,0,.15), var(--shadow);
    position: relative;
  }
  .globe::after {
    content: ""; position: absolute; width: 22px; height: 22px; right: -4px; top: -4px;
    border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--guess); border: 3px solid var(--bg);
  }

  #result-map { flex: 1; min-height: 0; }
  .result-card {
    position: absolute; z-index: 1000;
    left: 50%; transform: translateX(-50%);
    bottom: calc(var(--safe-b) + 16px);
    width: min(520px, calc(100vw - var(--safe-l) - var(--safe-r) - 24px));
    background: var(--surface); color: var(--fg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow);
  }
  .result-card .points { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 2.2rem; line-height: 1; }
  .result-card .points small { font-size: 1rem; font-weight: 600; color: var(--muted); }
  .result-card .place { font-size: 1.1rem; margin-top: 6px; }
  .result-card .place b { color: var(--real); }
  .result-card .dist { color: var(--muted); margin-top: 2px; }
  .legend { display: flex; gap: 14px; font-size: .85rem; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .bar { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; margin: 12px 0 14px; }
  .bar > div { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--real)); transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .result-card button { width: 100%; }

  #final .wrap { width: min(560px, 100%); }
  #final .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: var(--muted); }
  #final .total { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(3rem, 14vw, 4.6rem); line-height: 1; margin: 6px 0 2px; }
  #final .total small { font-size: .35em; color: var(--muted); font-weight: 600; }
  #final .verdict { font-size: 1.35rem; color: var(--accent); font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; margin: 6px 0 20px; }
  table { width: 100%; border-collapse: collapse; text-align: left; margin-bottom: 24px; font-size: .95rem; }
  th, td { padding: 10px 6px; border-bottom: 1px solid var(--line); }
  th { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.pts { font-weight: 700; }
  #final button { font-size: 1.1rem; padding: .8em 2em; }

  .leaflet-container { background: #aad3df; font-family: "Atkinson Hyperlegible", sans-serif; }
  .leaflet-container a { color: inherit; }
  @media (prefers-color-scheme: dark) {
    .leaflet-container { background: #1b2b36; }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.6); }
    .leaflet-control-attribution { background: rgba(18,40,58,.8) !important; color: #c9d6dd; }
    .leaflet-bar a { background: #1a3449; color: var(--paper); border-color: rgba(255,255,255,.12); }
  }
</style>
</head>
<body>

<div id="sv-wrap">
  <iframe id="sv" title="Street View" allow="accelerometer; gyroscope; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<div id="hud" class="hidden">
  <div class="hud-stats">
    <div><span class="label">Round</span><span class="val" id="hud-round">1/5</span></div>
    <div><span class="label">Score</span><span class="val" id="hud-score">0</span></div>
  </div>
  <div class="hud-actions">
    <button class="ghost" id="btn-back" title="Return to where this round started">Back to start</button>
    <button class="ghost" id="btn-skip" title="No imagery? Get a different location">Skip location</button>
  </div>
</div>

<div id="guess-panel" class="hidden">
  <div id="guess-map"></div>
  <div class="guess-controls">
    <button class="ghost" id="map-toggle">Open map</button>
    <button id="btn-guess" disabled>Guess</button>
  </div>
</div>

<section id="start" class="overlay center-screen">
  <div class="globe" aria-hidden="true"></div>
  <h1>Where on <span>Earth?</span></h1>
  <p>You're dropped somewhere on the planet. Look around, then pin your guess on the map — the closer you are, the more points you score.</p>
  <button id="btn-start">Start game</button>
</section>

<section id="result" class="overlay hidden">
  <div id="result-map"></div>
  <div class="result-card">
    <div class="points"><span id="res-points">0</span> <small>points</small></div>
    <div class="place">It was <b id="res-place"></b></div>
    <div class="dist" id="res-dist"></div>
    <div class="legend"><span><i style="background:var(--guess)"></i>Your guess</span><span><i style="background:var(--real)"></i>Actual location</span></div>
    <div class="bar"><div id="res-bar"></div></div>
    <button id="btn-next">Next round</button>
  </div>
</section>

<section id="final" class="overlay center-screen hidden">
  <div class="wrap">
    <div class="eyebrow">Final score</div>
    <div class="total"><span id="final-total">0</span> <small>/ 25,000</small></div>
    <div class="verdict" id="final-verdict"></div>
    <table>
      <thead><tr><th>#</th><th>Place</th><th class="num">Distance</th><th class="num">Points</th></tr></thead>
      <tbody id="final-rows"></tbody>
    </table>
    <button id="btn-again">Play again</button>
  </div>
</section>

  const ROUNDS = 5;
  const MAX_POINTS = 5000;

  const $ = (id) => document.getElementById(id);
  const els = {
    sv: $("sv"), hud: $("hud"), round: $("hud-round"), score: $("hud-score"),
    panel: $("guess-panel"), guessBtn: $("btn-guess"), toggle: $("map-toggle"),
    start: $("start"), result: $("result"), final: $("final"),
    resPoints: $("res-points"), resPlace: $("res-place"), resDist: $("res-dist"), resBar: $("res-bar"),
    nextBtn: $("btn-next"), finalTotal: $("final-total"), finalVerdict: $("final-verdict"), finalRows: $("final-rows"),
  };

  // ---------- Location deck (shuffled, no repeats until exhausted) ----------
  let deck = [];
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function drawLocation() {
    if (!deck.length) deck = shuffle(LOCATIONS.slice());
    const [name, lat, lng] = deck.pop();
    return { name, lat, lng, heading: Math.floor(Math.random() * 360) };
  }

  // ---------- Geo + scoring ----------
  function haversineKm(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 +
      Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function scoreFor(km) {
    if (km < 0.1) return MAX_POINTS;
    return Math.round(MAX_POINTS * Math.exp(-km / 1500));
  }
  function fmtDist(km) {
    if (km < 1) return Math.round(km * 1000) + " m";
    return (km < 10 ? km.toFixed(1) : Math.round(km).toLocaleString("en-US")) + " km";
  }
  const fmtNum = (n) => n.toLocaleString("en-US");

  // ---------- Maps ----------
  // OpenStreetMap standard tiles: free, no API key (dark mode is a CSS filter)
  const ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  const makeTiles = () => L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: ATTRIBUTION, maxZoom: 19,
  });

  const pinIcon = (kind) => L.divIcon({
    className: "", html: `<div class="pin ${kind}"></div>`,
    iconSize: [26, 26], iconAnchor: [13, 30],
  });

  // Stop panning past the poles so the map never shows empty space
  const mapOpts = {
    worldCopyJump: true, minZoom: 1,
    maxBounds: [[-85, -100000], [85, 100000]], maxBoundsViscosity: 1,
  };
  const guessMap = L.map("guess-map", mapOpts).setView([20, 0], 1);
  makeTiles().addTo(guessMap);

  const resultMap = L.map("result-map", mapOpts).setView([20, 0], 2);
  makeTiles().addTo(resultMap);
  const resultLayer = L.layerGroup().addTo(resultMap);

  // Smallest zoom at which the world is at least as tall as the map
  function worldZoom(map) {
    const h = map.getSize().y || 256;
    return Math.max(1, Math.ceil(Math.log2(h / 256)));
  }
  function showWholeWorld() {
    guessMap.invalidateSize({ pan: false });
    const z = worldZoom(guessMap);
    guessMap.setMinZoom(z);
    guessMap.setView([20, 0], z, { animate: false });
  }

  let guessMarker = null;
  guessMap.on("click", (e) => {
    const ll = e.latlng;
    if (guessMarker) guessMarker.setLatLng(ll);
    else guessMarker = L.marker(ll, { icon: pinIcon("guess"), keyboard: false }).addTo(guessMap);
    els.guessBtn.disabled = false;
  });

  // Keep Leaflet sized correctly while the panel animates
  const panelObserver = new ResizeObserver(() => guessMap.invalidateSize({ pan: false }));
  panelObserver.observe($("guess-map"));

  // ---------- Game state ----------
  let state = null;

  function show(el, on) { el.classList.toggle("hidden", !on); }

  function loadStreetView(loc) {
    const src = `https://maps.google.com/maps?layer=c&cbll=${loc.lat},${loc.lng}` +
      `&cbp=12,${loc.heading},,0,0&output=svembed`;
    els.sv.src = "about:blank";
    requestAnimationFrame(() => { els.sv.src = src; });
  }

  function updateHud() {
    els.round.textContent = `${state.round + 1}/${ROUNDS}`;
    els.score.textContent = fmtNum(state.total);
  }

  function resetGuessMap() {
    if (guessMarker) { guessMap.removeLayer(guessMarker); guessMarker = null; }
    els.guessBtn.disabled = true;
    setMapOpen(false);
    showWholeWorld();
  }

  function startRound() {
    state.current = drawLocation();
    loadStreetView(state.current);
    resetGuessMap();
    updateHud();
    show(els.result, false);
    show(els.final, false);
    show(els.hud, true);
    show(els.panel, true);
    setTimeout(showWholeWorld, 50);
  }

  function newGame() {
    state = { round: 0, total: 0, history: [], current: null };
    show(els.start, false);
    startRound();
  }

  function submitGuess() {
    if (!guessMarker) return;
    const g = guessMarker.getLatLng().wrap();
    const guess = { lat: g.lat, lng: g.lng };
    const real = state.current;
    const km = haversineKm(guess, real);
    const pts = scoreFor(km);
    state.total += pts;
    state.history.push({ name: real.name, km, pts });
    updateHud();

    // Result screen
    show(els.panel, false);
    show(els.result, true);
    els.sv.src = "about:blank";
    els.resPoints.textContent = fmtNum(pts);
    els.resPlace.textContent = real.name;
    els.resDist.textContent = km < 0.1
      ? "Spot on — less than 100 m away!"
      : `Your guess was ${fmtDist(km)} away.`;
    els.resBar.style.width = "0%";
    els.nextBtn.textContent = state.round + 1 >= ROUNDS ? "See final score" : "Next round";

    resultLayer.clearLayers();
    // Draw the line along the shorter way around the globe
    let gLng = guess.lng;
    if (gLng - real.lng > 180) gLng -= 360;
    else if (real.lng - gLng > 180) gLng += 360;
    const gLL = L.latLng(guess.lat, gLng), rLL = L.latLng(real.lat, real.lng);
    L.polyline([gLL, rLL], { color: "#F2A33A", weight: 3, dashArray: "8 10", opacity: 0.95 }).addTo(resultLayer);
    L.marker(gLL, { icon: pinIcon("guess"), keyboard: false }).addTo(resultLayer);
    L.marker(rLL, { icon: pinIcon("real"), keyboard: false }).addTo(resultLayer);

    requestAnimationFrame(() => {
      resultMap.invalidateSize();
      resultMap.setMinZoom(worldZoom(resultMap));
      const card = document.querySelector(".result-card");
      const bottomPad = (card ? card.offsetHeight : 200) + 40;
      resultMap.fitBounds(L.latLngBounds([gLL, rLL]), {
        paddingTopLeft: [50, 60], paddingBottomRight: [50, bottomPad], maxZoom: 14, animate: false,
      });
      setTimeout(() => { els.resBar.style.width = (pts / MAX_POINTS * 100).toFixed(1) + "%"; }, 80);
    });
  }

  function nextRound() {
    state.round++;
    if (state.round >= ROUNDS) return showFinal();
    startRound();
  }

  function verdictFor(pct) {
    if (pct >= 90) return "Human GPS. Are you sure you didn't peek?";
    if (pct >= 75) return "Seasoned globetrotter.";
    if (pct >= 55) return "Well-traveled — nicely done.";
    if (pct >= 35) return "Getting your bearings.";
    if (pct >= 15) return "Scenic route enthusiast.";
    return "Lost, but having a great time.";
  }

  function showFinal() {
    show(els.result, false);
    show(els.hud, false);
    show(els.panel, false);
    const max = ROUNDS * MAX_POINTS;
    els.finalTotal.textContent = fmtNum(state.total);
    els.finalVerdict.textContent = verdictFor(state.total / max * 100);
    els.finalRows.innerHTML = "";
    state.history.forEach((h, i) => {
      const tr = document.createElement("tr");
      const cells = [String(i + 1), h.name, fmtDist(h.km), fmtNum(h.pts)];
      cells.forEach((text, c) => {
        const td = document.createElement("td");
        td.textContent = text;
        if (c >= 2) td.className = "num" + (c === 3 ? " pts" : "");
        tr.appendChild(td);
      });
      els.finalRows.appendChild(tr);
    });
    show(els.final, true);
  }

  // ---------- Mobile map toggle ----------
  function setMapOpen(open) {
    els.panel.classList.toggle("open", open);
    els.toggle.textContent = open ? "Hide map" : "Open map";
    if (open) setTimeout(() => (guessMarker ? guessMap.invalidateSize() : showWholeWorld()), 30);
  }

  // ---------- Wiring ----------
  $("btn-start").addEventListener("click", newGame);
  $("btn-again").addEventListener("click", newGame);
  els.guessBtn.addEventListener("click", submitGuess);
  els.nextBtn.addEventListener("click", nextRound);
  els.toggle.addEventListener("click", () => setMapOpen(!els.panel.classList.contains("open")));
  $("btn-back").addEventListener("click", () => state && loadStreetView(state.current));
  $("btn-skip").addEventListener("click", () => {
    if (!state) return;
    state.current = drawLocation();
    loadStreetView(state.current);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.tagName === "BUTTON") return;
    if (!els.result.classList.contains("hidden")) { e.preventDefault(); nextRound(); }
    else if (!els.panel.classList.contains("hidden") && guessMarker) { e.preventDefault(); submitGuess(); }
  });
})();
